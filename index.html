<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Burger AR</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e7e7e7;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .model-container {
            height: 700px;
            width: 700px;
        }

        model-viewer {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="model-container">
        <model-viewer           
    src="/assets/burger.glb"         
    ios-src="/assets/burger.usdz"     
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    autoplay
    alt="3D burger model">
</model-viewer>

    </div>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</body>

</html>
